services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skybook
      POSTGRES_USER: skybook
      POSTGRES_PASSWORD: skybook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skybook -d skybook"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://skybook:skybook@db:5432/skybook
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
